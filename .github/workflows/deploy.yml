# Migrates each environment's database, then deploys the same commit to its Vercel project.
# Vercel's own Git deploys are off for dev and main (vercel.json), so code never reaches an
# environment before its migrations. See docs/reference/environments.md.
name: Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@65.2.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy:
    name: deploy (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # dev deploys from the dev branch; production and demo from main.
        environment: ${{ github.ref_name == 'main' && fromJSON('["production","demo"]') || fromJSON('["dev"]') }}
    # Never cancel a run halfway through a migration; queue the next one instead.
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}
      url: ${{ vars.APP_URL || steps.deploy.outputs.url }}
    # Each GitHub environment (dev, production, demo) holds its own copy of these secrets.
    env:
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      APP_SERVER_DB_PASSWORD: ${{ secrets.APP_SERVER_DB_PASSWORD }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # The demo project is created later (about 22 Nov). Until its secrets exist, skip it cleanly.
      - name: Check this environment is set up
        id: check
        run: |
          if [ -z "$DATABASE_MIGRATION_URL" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            if [ "${{ matrix.environment }}" = "demo" ]; then
              echo "::notice::Demo isn't set up yet (the demo environment has no DATABASE_MIGRATION_URL or VERCEL_PROJECT_ID). Skipping."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Missing the database or Vercel secrets for ${{ matrix.environment }}."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v7.0.1

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Migrate the database
        if: steps.check.outputs.ready == 'true'
        run: npm run db:migrate

      # Species are reference data: the seed is idempotent and never changes an album number.
      - name: Seed the species catalog
        if: steps.check.outputs.ready == 'true'
        run: npm run db:seed:catalog

      - name: Pull the Vercel settings and variables
        if: steps.check.outputs.ready == 'true'
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.check.outputs.ready == 'true'
        env:
          APP_COMMIT_SHA: ${{ github.sha }}
          # Source maps go to Sentry when the token is set; the build skips the upload otherwise.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ github.sha }} to ${{ matrix.environment }}: $url" >> "$GITHUB_STEP_SUMMARY"

      # The environment's address (GitHub environment variable APP_URL) must answer /api/health
      # with this commit and status ok. A 503 means the app can't reach its database.
      - name: Check the live site serves this commit
        if: steps.check.outputs.ready == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL isn't set for ${{ matrix.environment }}; skipping the health check."
            exit 0
          fi
          # A fresh deployment's first database connection can miss the 2-second limit (cold start),
          # so "degraded" only fails the job if it lasts the whole 3 minutes.
          commit=""
          status=""
          for attempt in $(seq 1 18); do
            body=$(curl -s --max-time 10 "$APP_URL/api/health" || true)
            commit=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            status=$(echo "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = "ok" ]; then
              echo "$APP_URL serves $GITHUB_SHA and its database answers." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for $APP_URL: commit '${commit:-unknown}', status '${status:-unknown}' ($attempt/18)"
            sleep 10
          done
          if [ "$commit" = "$GITHUB_SHA" ]; then
            echo "::error::$APP_URL serves this commit, but /api/health still says '$status' after 3 minutes. Check DATABASE_URL in the Vercel project, and the health.degraded log for the reason."
          else
            echo "::error::$APP_URL didn't serve $GITHUB_SHA within 3 minutes."
          fi
          exit 1
